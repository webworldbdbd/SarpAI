
name: SARP AI - Android Build and Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: sarpai-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test SARP AI
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Locate or extract Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="."

          if [[ ! -f "settings.gradle.kts" && ! -f "settings.gradle" ]]; then
            ZIP_FILE="$(find . -maxdepth 2 -type f \
              \( -iname 'SarpAI-project.zip' \
              -o -iname 'SARP-AI-Professional-Test-Project.zip' \
              -o -iname '*sarp*ai*.zip' \) \
              -print -quit)"

            if [[ -z "$ZIP_FILE" ]]; then
              echo "::error::Android project files and SARP AI ZIP were not found."
              echo "Repository files:"
              find . -maxdepth 3 -type f | head -200
              exit 1
            fi

            mkdir -p extracted-project
            unzip -q "$ZIP_FILE" -d extracted-project

            SETTINGS_FILE="$(find extracted-project -type f \
              \( -name 'settings.gradle.kts' \
              -o -name 'settings.gradle' \) \
              -print -quit)"

            if [[ -z "$SETTINGS_FILE" ]]; then
              echo "::error::ZIP does not contain a Gradle settings file."
              find extracted-project -maxdepth 4 -type f | head -200
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          if [[ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            echo "::error::app/build.gradle.kts was not found."
            echo "Detected project directory: $PROJECT_DIR"
            find "$PROJECT_DIR" -maxdepth 3 -type f | head -200
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project directory: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-cleanup: on-success

      - name: Check project configuration
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts -o -f settings.gradle
          test -f build.gradle.kts -o -f build.gradle
          test -f app/build.gradle.kts -o -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "Project structure check passed."

      - name: Run unit tests
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists
        id: apk
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -f "$APK" ]]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SARP-AI-debug-APK
          path: ${{ steps.project.outputs.dir }}/${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SARP-AI-diagnostics
          path: |
            ${{ steps.project.outputs.dir }}/app/build/reports/
            ${{ steps.project.outputs.dir }}/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
